# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

#Defining Global Environment variable which can be used anywhere in the workflow
env:
  APP_NAME: Manoj-GitHub-App

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
      
  TEST:
    runs-on: ubuntu-latest
    steps:
      #Simple echo job printing
      - name: print my name
        run: echo "Manoj Upadhya"

      #demo for checkout actions which checkouts the current git repository, same as git clone
      - name: checkout repository
        uses: actions/checkout@v7
        
      #Running multiple commands in one run using |
      - name: print hello
        run: |
          pwd
          ls -la
          whoami
          
      #github context or builtin variables which provides information about github actions
      - name: show github information
        run: |
          echo "Repository: ${{github.repository}}"
          echo "Triggered By: ${{github.actor}}"
          echo "Branch: ${{github.ref}}"
          echo "commit: ${{github.sha}}"
          echo "Event: ${{github.event_name}}"
          echo "workflow: ${{github.workflow}}"
          
      #Trying to access the local env variables which is defined under different job
      - name: print Local Env Variable
        run: echo "Application Environment is $ENVIRONMENT"

        
      #Repository
      - name: print repository variable
        run: echo "Environment = ${{ vars.APP_ENV }}"
        
  # The second job of the workflow
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    #Build job will be started only after Test is completed, we use needs to define the logic
    needs: TEST
  

    #environment variable defined at job level
    env:
      ENVIRONMENT: development

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world! I am learning Github Actions

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
          
      #Print Global Env variable which is defined as global environment variable
      - name: print Global Env Variable
        run: echo "Application name is $APP_NAME"

      #printing the local environment variable which is created under job build
      - name: print Local Env Variable
        run: echo "Application Environment is  ${{ env.ENVIRONMENT }}"

      #Example for defining env variable at step level
      
      - name: print Env Variable defined under step level
        env:
          VERSION: "1.0"
        run: echo "Application Version is $VERSION"

        #Repository
      - name: print repository variable
        run: echo "Environment = ${{ vars.APP_ENV }}"
    
  # The Third job of the workflow
  Deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    #Deploy job will be started only after Test and build is completed, we use needs to define the logic
    needs: 
      - build
      - TEST
    
    #environment variable defined at job level
    env:
      ENVIRONMENT: development

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world! I am learning Github Actions
      
      
      
